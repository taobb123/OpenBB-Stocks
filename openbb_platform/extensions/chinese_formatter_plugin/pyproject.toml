[tool.poetry]
name = "openbb-chinese-formatter"
version = "0.1.0"
description = "Chinese metric formatter extension for OpenBB"
authors = ["OpenBB Team <hello@openbb.co>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_chinese_formatter" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
openbb-core = "^1.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_core_extension"]
chinese_formatter = "openbb_chinese_formatter.__init__:load"
